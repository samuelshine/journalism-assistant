[project]
name = "newsroom-api"
version = "0.1.0"
description = "Agentic AI journalism assistant — API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.6",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
    "tenacity>=9.0",
    "faster-whisper>=1.0",
    "yt-dlp>=2024.8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
